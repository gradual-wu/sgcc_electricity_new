name: "SGCC Electricity"
version: "v1.14.0"
slug: "sgcc_electricity"
description: "获取国网电费数据的插件"
url: "https://github.com/gradual-wu/sgcc_electricity_new"
arch:
  - aarch64
  - amd64
host_network: true
full_access: true
startup: application
boot: auto
init: false
image: "ghcr.io/gradual-wu/sgcc_electricity-{arch}"
map:
  # - addons:rw
  - config:rw
  # - media:rw
  - type: data
    read_only: False
options:
  PHONE_NUMBER: ""
  PASSWORD: ""
  IGNORE_USER_ID: "xxxx,xxxx"
  USER_NAMES: ""
  DB_TYPE: "NONE"
  DB_NAME: "homeassistant.db"
  MYSQL_HOST: ""
  MYSQL_USER: ""
  MYSQL_PASSWORD: ""
  MYSQL_DATABASE: "sgcc"
  MYSQL_PORT: 3306
  HASS_URL: "http://homeassistant.local:8123/"
  HASS_TOKEN: ""
  HASS_WWW_DIR: "/config/www"
  MQTT_HOST: "127.0.0.1"
  MQTT_PORT: 1883
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
  MQTT_DISCOVERY_PREFIX: "homeassistant"
  MQTT_STATE_PREFIX: "sgcc_electricity"
  ENTITY_ID_STYLE: "none"
  CLEANUP_LEGACY_ENTITY_IDS: true
  CLEANUP_LEGACY_REST_STATES: true
  JOB_START_TIME: "07:00"
  RETRY_WAIT_TIME_OFFSET_UNIT: 15
  PAGE_WAIT_TIME: 10
  DATA_RETENTION_DAYS: 0
  DAILY_FETCH_DAYS: 7
  DAILY_RECONCILE_DAYS: 7
  # 交费记录 / 官方账单 / 阶梯 / 全年回补
  PAYMENT_FETCH_ENABLED: true
  PAYMENT_FETCH_START: ""
  PAYMENT_FETCH_LIMIT: 200
  PAYMENT_FETCH_INTERVAL_DAYS: 7
  BILL_SYNC_ENABLED: true
  BILL_SYNC_MAX_MONTHS: 12
  TIER_SYNC_ENABLED: true
  TIER1_MAX: 2160
  TIER2_MAX: 4200
  YEAR_BACKFILL_ENABLED: true
  YEAR_BACKFILL_START: ""
  YEAR_BACKFILL_CHUNK_DAYS: 30
  FORCE_YEAR_BACKFILL: false
  FORCE_FULL_REFRESH: false
  PUSH_TYPE: "None"
  BALANCE: 5.0
  PUSHPLUS_TOKEN: "xxxx,xxxx"
  PUSH_URL: ""
  PUSH_QRCODE_URL: ""
  LOGIN_FALLBACK: "qrcode"
  QR_CODE_LOGIN_WAIT_COUNT: 18
  QR_CODE_LOGIN_WAIT_TIME_INTERVAL_UNIT: 10
  LLM_API_KEY: ""
  LLM_BASE_URL: ""
  LLM_MODEL: ""
schema:
  PHONE_NUMBER: str
  PASSWORD: password
  IGNORE_USER_ID: str
  USER_NAMES: str?
  DB_TYPE: "list(NONE|SQLITE|MYSQL)"
  DB_NAME: str
  MYSQL_HOST: str?
  MYSQL_USER: str?
  MYSQL_PASSWORD: password?
  MYSQL_DATABASE: str?
  MYSQL_PORT: int?
  HASS_URL: url
  HASS_TOKEN: str
  HASS_WWW_DIR: str?
  MQTT_HOST: str?
  MQTT_PORT: int?
  MQTT_USERNAME: str?
  MQTT_PASSWORD: password?
  MQTT_DISCOVERY_PREFIX: str?
  MQTT_STATE_PREFIX: str?
  ENTITY_ID_STYLE: "list(none|full|last4)?"
  CLEANUP_LEGACY_ENTITY_IDS: bool?
  CLEANUP_LEGACY_REST_STATES: bool?
  JOB_START_TIME: str
  RETRY_WAIT_TIME_OFFSET_UNIT: int(2,30)
  PAGE_WAIT_TIME: int(2,60)?
  DATA_RETENTION_DAYS: int
  DAILY_FETCH_DAYS: "list(7|30)"
  DAILY_RECONCILE_DAYS: int(1,90)?
  PAYMENT_FETCH_ENABLED: bool?
  PAYMENT_FETCH_START: str?
  PAYMENT_FETCH_LIMIT: int?
  PAYMENT_FETCH_INTERVAL_DAYS: int(1,90)?
  BILL_SYNC_ENABLED: bool?
  BILL_SYNC_MAX_MONTHS: int?
  TIER_SYNC_ENABLED: bool?
  TIER1_MAX: float?
  TIER2_MAX: float?
  YEAR_BACKFILL_ENABLED: bool?
  YEAR_BACKFILL_START: str?
  YEAR_BACKFILL_CHUNK_DAYS: int?
  FORCE_YEAR_BACKFILL: bool?
  FORCE_FULL_REFRESH: bool?
  PUSH_TYPE: "list(None|PUSHPLUS|URLPUSH)"
  BALANCE: float
  PUSHPLUS_TOKEN: str
  PUSH_URL: str?
  PUSH_QRCODE_URL: str?
  LOGIN_FALLBACK: "list(qrcode|None)"
  QR_CODE_LOGIN_WAIT_COUNT: int(1,60)
  QR_CODE_LOGIN_WAIT_TIME_INTERVAL_UNIT: int(2,30)
  LLM_API_KEY: password
  LLM_BASE_URL: str?
  LLM_MODEL: str?
