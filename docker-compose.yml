services:
  sgcc_electricity_app:
    # 本地构建：直接使用当前目录下的代码（包含你的修改）
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
    image: sgcc_electricity_local
    # 也可以改用 GitHub Actions 构建好的镜像：
    # image: ghcr.io/gradual-wu/sgcc_electricity-amd64:latest
    env_file:
      - .env
    container_name: sgcc_electricity
    network_mode: "host"
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
    restart: unless-stopped
    volumes:
      - ./:/data        # if you want to read homeassistant.db, homeassistant.db is in the container at /data/
    command: python3 main.py
    init: true
